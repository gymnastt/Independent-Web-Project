<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Independent Project</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/nav.css">
    <script src="js/script.js" defer></script>
</head>
<body>

<nav>
  <ul>
    <li><a href="index.html">Home</a></li>
    <li class="dropdown">
      <details>
        <summary>Tasks</summary>
        <ul class="dropdown-menu">
          <li><a href="tasks.html" aria-current="page">To Do List</a></li>
          <li><a href="important.html">Important List</a></li>
          <li><a href="school.html">School Homework</a></li>
          <li><a href="random.html">Random (low priority)</a></li>
          <li><a href="extra.html">Extra</a></li>
        </ul>
      </details>
    </li>
  </ul>
</nav>

<div id="myDIV" class="header">
  <h1 style="margin:5px; color: rgb(122, 0, 0)">My To Do List</h1>
  <form id="taskForm" class="task-form">
    <label>Task
      <input type="text" id="myInput" placeholder="Title..." required>
    </label>
    <label>Work time (minutes)
      <input type="number" id="taskDuration" min="1" step="1" placeholder="e.g. 30">
    </label>
    <label>Importance (1-3)
      <select id="taskImportance">
        <option value="1">1 - Low</option>
        <option value="2" selected>2 - Medium</option>
        <option value="3">3 - High</option>
      </select>
    </label>
    <label>Notes
      <textarea id="taskNotes" rows="2" placeholder="Add task notes..."></textarea>
    </label>
    <button type="submit" class="addBtn">Add</button>
  </form>
</div>

<ul id="myUL">
</ul>

<p id="emptyState" class="empty-state" hidden>No tasks yet. Add one above!</p>



</body>
</html>
